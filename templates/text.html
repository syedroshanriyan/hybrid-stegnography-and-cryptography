<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Text Steganography</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="content">
    <a href="/" class="back-btn">⬅ BACK</a>
    <h1 class="title">TEXT STEGANOGRAPHY</h1>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <div class="split-container">
        <!-- Left half: Hide Text -->
        <div class="card split-panel">
            <h2>Hide Text In Image</h2>
            <form method="POST" enctype="multipart/form-data">
                <input type="hidden" name="action" value="hide">

                <label>Cover Image</label>
                <input type="file" name="cover" required>

                <label>Secret Text</label>
                <textarea name="msg" required></textarea>

                <label>Password</label>
                <input type="password" name="pw" required>

                <button class="cyber-btn">Encrypt & Hide</button>
            </form>

            {% if text_stego %}
            <div class="result">
                <a href="{{ text_stego }}" download>Download Stego Image</a>
                <img src="{{ text_stego }}">
            </div>
            {% endif %}
        </div>

        <!-- Right half: Retrieve Text -->
        <div class="card split-panel">
            <h2>Retrieve Text From Image</h2>
            <form method="POST" enctype="multipart/form-data">
                <input type="hidden" name="action" value="extract">

                <label>Stego Image</label>
                <input type="file" name="stego" required>

                <label>Password</label>
                <input type="password" name="pw" required>

                <button class="cyber-btn">Extract</button>
            </form>

            {% if text_out %}
            <pre class="result">{{ text_out }}</pre>
            {% endif %}
        </div>
    </div>
</div>

</body>
</html>
