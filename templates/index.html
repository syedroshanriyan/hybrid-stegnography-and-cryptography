<link rel="stylesheet" href="/static/css/style.css">

<style>
/* Make home body fill screen */
.home-body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* Keep homepage content centered */
.home-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;

    max-width: 900px;
    width: 100%;

    margin: 0 auto;
    padding: 1.5rem;
}

/* Typing effect */
.typing {
    width: 42ch;
    margin: 0 auto 30px auto;
    overflow: hidden;
    white-space: nowrap;
    border-right: 3px solid #00eaff;
    animation: typing 4s steps(42), blink .5s step-end infinite alternate;
    text-align: center;
    padding-bottom: 5%;
}

@keyframes typing {
    from { width: 0; }
}

@keyframes blink {
    50% { border-color: transparent; }
}

/* Buttons column */
.menu-buttons {
    display: flex;
    flex-direction: column;
    gap: 3rem;
    align-items: center;
}

.menu-buttons a {
    width: 100%;
    max-width: 500px;
    text-align: center;
    text-decoration: none;
}

/* Title */
.title-glitch {
    font-size: 50px;
    text-align: center;
    padding-bottom: 5%;
}

/* Responsive tweaks */
@media (max-width: 768px) {
    .home-container {
        padding: 1rem;
    }

    .title-glitch {
        font-size: 45px;
        line-height: 1.3;
        padding: 0 0.5rem;
    }

    .typing {
        width: 100%;
        max-width: 95vw;
        font-size: 14px;
        white-space: normal;
        border-right: none;
    }

    .menu-buttons a {
        max-width: 280px;
    }
}

@media (max-width: 420px) {
    .title-glitch {
        font-size: 22px;
    }

    .typing {
        font-size: 13px;
    }
}
</style>
</head>
